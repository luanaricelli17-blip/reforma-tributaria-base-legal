name: Publicar somente versões aprovadas
on:
  push:
    branches: [main]
    paths:
      - 'approved/*.record.json'
      - 'monitor/state.json'
      - 'sync/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar integridade e referências estruturais
        run: python sync/validate_records.py
      - name: Sincronizar apenas registros validados
        run: python sync/publish_records.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
