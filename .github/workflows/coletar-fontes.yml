name: Coletar mudanças em fontes oficiais
on:
  schedule:
    - cron: '23 11 * * *'   # 08:23 horário de Brasília (UTC-3)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar fontes oficiais
        run: python monitor/check_sources.py
      - name: Propor mudanças, sem publicar normas
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            monitor/state.json
            candidates/*.json
          branch: bot/sinais-fontes-oficiais
          delete-branch: true
          commit-message: 'chore: detectar alterações em fontes oficiais'
          title: 'REVISAR: possíveis alterações em fontes oficiais'
          body: |
            ## Revisão humana obrigatória
            Este PR representa alterações técnicas em páginas oficiais. **Não prova mudança legal.**
            - [ ] Abrir cada link oficial e verificar texto/número/dispositivo.
            - [ ] Comparar publicação, vigência, início dos efeitos e eventuais revogações.
            - [ ] Separar alterações cosméticas de atualizações normativas.
            - [ ] Aprovar o PR somente após inspecionar a fonte.
            - [ ] Quando relevante, criar NOVA versão em approved/*.record.json em outro PR revisado.
            A automação NUNCA escreve diretamente na base jurídica Supabase.
